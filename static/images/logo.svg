<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <!-- Icon gradient: top-left blue → bottom-right cyan -->
    <linearGradient id="iconGrad" x1="4" y1="8" x2="60" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Shield inner gradient -->
    <linearGradient id="shieldGrad" x1="21" y1="13" x2="43" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <!-- Text "Sentry" gradient -->
    <linearGradient id="textGrad" x1="86" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- ══ HEXAGON ══
       Flat-top hex: center (32,32), radius 28
       0°(60,32)  60°(46,7.75)  120°(18,7.75)
       180°(4,32) 240°(18,56.25) 300°(46,56.25) -->
  <polygon
    points="60,32 46,7.75 18,7.75 4,32 18,56.25 46,56.25"
    fill="url(#iconGrad)" fill-opacity="0.1"
    stroke="url(#iconGrad)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Corner circuit nodes -->
  <circle cx="60" cy="32"    r="2.2" fill="#3B82F6"/>
  <circle cx="46" cy="7.75"  r="2.2" fill="#06B6D4"/>
  <circle cx="18" cy="7.75"  r="2.2" fill="#06B6D4"/>
  <circle cx="4"  cy="32"    r="2.2" fill="#3B82F6"/>
  <circle cx="18" cy="56.25" r="2.2" fill="#06B6D4"/>
  <circle cx="46" cy="56.25" r="2.2" fill="#06B6D4"/>

  <!-- Short circuit trace from right vertex -->
  <line x1="60" y1="32" x2="70" y2="32"
        stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="70" cy="32" r="1.5" fill="#3B82F6" fill-opacity="0.3"/>

  <!-- ══ SHIELD ══ -->
  <path d="M32,13 L43,18 L43,33 Q43,47 32,51 Q21,47 21,33 L21,18 Z"
        fill="url(#shieldGrad)" fill-opacity="0.92"/>
  <!-- Shield highlight rim -->
  <path d="M32,13 L43,18 L43,33 Q43,47 32,51 Q21,47 21,33 L21,18 Z"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>

  <!-- ══ LOCK BODY ══ -->
  <rect x="27" y="35" width="10" height="8.5" rx="1.5"
        fill="white" fill-opacity="0.96"/>

  <!-- ══ LOCK SHACKLE ══ -->
  <path d="M28.5,35 L28.5,31 Q28.5,28 32,28 Q35.5,28 35.5,31 L35.5,35"
        stroke="white" stroke-width="1.8" stroke-linecap="round"
        fill="none" stroke-opacity="0.96"/>

  <!-- ══ KEYHOLE ══ -->
  <circle cx="32" cy="38.8" r="1.4" fill="#1D4ED8"/>
  <line x1="32" y1="40.2" x2="32" y2="42.3"
        stroke="#1D4ED8" stroke-width="1.3" stroke-linecap="round"/>

  <!-- ══ SEPARATOR ══ -->
  <line x1="78" y1="12" x2="78" y2="52"
        stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- ══ BRAND NAME ══ -->
  <text x="88" y="36"
    font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="800" letter-spacing="-0.5">
    <tspan fill="white">Indu</tspan><tspan fill="url(#textGrad)">Sentry</tspan>
  </text>

  <!-- ══ TAGLINE ══ -->
  <text x="89" y="49"
    font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="7.8" font-weight="700" letter-spacing="1.8" fill="#475569">
    IDS-IIoT SECURITY PLATFORM
  </text>
</svg>
