<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Flat-top hexagon: center (16,16), radius 13 -->
  <!-- 0°(29,16) 60°(22.5,4.74) 120°(9.5,4.74) 180°(3,16) 240°(9.5,27.26) 300°(22.5,27.26) -->
  <polygon
    points="29,16 22.5,4.74 9.5,4.74 3,16 9.5,27.26 22.5,27.26"
    fill="url(#g)"
    stroke="rgba(255,255,255,0.18)" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Lock body -->
  <rect x="11.5" y="18.5" width="9" height="6" rx="1.6"
        fill="white" fill-opacity="0.96"/>

  <!-- Lock shackle -->
  <path d="M13.2,18.5 L13.2,15 Q13.2,12.5 16,12.5 Q18.8,12.5 18.8,15 L18.8,18.5"
        fill="none" stroke="white" stroke-width="1.9"
        stroke-linecap="round" stroke-opacity="0.96"/>
